<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% seo %}

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
  </head>
  <body class="site">
    <header class="site-header">
      <div class="container header-inner">
        <a href="{{ '/' | relative_url }}" class="site-title">
          {{ site.title }}
        </a>
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
        <button id="theme-toggle" aria-label="Toggle theme">🌓</button>
      </div>
    </header>

    <main class="site-content container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
        <span class="footer-links">
          {% if site.author.github %}
          <a href="{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
          {% endif %}
          {% if site.author.linkedin %}
          <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
          {% endif %}
          {% if site.author.scholar %}
          <a href="{{ site.author.scholar }}" target="_blank" rel="noopener">Google Scholar</a>
          {% endif %}
        </span>
      </div>
    </footer>
  </body>
</html>
